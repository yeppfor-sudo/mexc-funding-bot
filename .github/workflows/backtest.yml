name: backtest
on: workflow_dispatch
jobs:
  backtest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.11' }
      - run: pip install ccxt requests
      - name: Create backtest file
        run: |
          cat > backtest_30d.py << 'PY'
          import requests, time
          BASE="https://contract.mexc.com/api/v1/contract"
          def get_hist(s):
              try:
                  r=requests.get(f"{BASE}/funding_rate/history", params={"symbol":s}, timeout=10).json()
                  d=r.get("data")
                  if not d: return []
                  if isinstance(d, dict): return [d]
                  return d
              except: return []
          detail=requests.get(f"{BASE}/detail", timeout=15).json().get("data") or []
          syms=[d["symbol"] for d in detail if "_USDT" in d["symbol"]]  # ALL, no limit
          print(f"Scanning ALL {len(syms)} perps...")
          wallet=1000.0; trades=0; killer=0; profit=0; found=[]
          for i,sym in enumerate(syms):
              hist=get_hist(sym)
              if not hist: 
                  time.sleep(0.01)
                  continue
              for e in hist[-30:]:
                  try:
                      rate=float(e.get("fundingRate",0))
                      if abs(rate)>=0.005:  # 0.5% -> INF
                          notional=wallet*0.99*5/3
                          pnl=notional*abs(rate)*0.75
                          profit+=pnl; trades+=1
                          found.append((sym, rate))
                          if trades%30==0:
                              profit-=notional/5*0.25; killer+=1
                  except: pass
              if i%200==0:
                  print(f"{i}/{len(syms)} checked... found {trades} trades")
              time.sleep(0.02)
          print(f"\n=== 30D ALL COINS ===")
          print(f"Total perps scanned: {len(syms)}")
          print(f"Trades >=0.5%: {trades}")
          print(f"Top coins: {sorted(found, key=lambda x: -abs(x[1]))[:10]}")
          print(f"Killer hits: {killer}")
          print(f"Profit: ${profit:.2f}")
          print(f"Start $1000 -> ${1000+profit:.2f}")
          print(f"Rule: 45s before, 3s after, 99%*5x, killer -5% price")
          PY
      - run: python backtest_30d.py
