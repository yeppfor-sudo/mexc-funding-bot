name: Run Funding Bot 24/7

on:
  workflow_dispatch:
  schedule:
    - cron: '0 */5 * * *'  # Auto restart every 5 hours (GitHub limit is 6h)

jobs:
  bot:
    runs-on: ubuntu-latest
    timeout-minutes: 350 # 5h50m max
    
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install ccxt requests pandas

      - name: Run Bot MIN 0.5% MAX ∞ EVERY 4H
        env:
          MEXC_API_KEY: ${{ secrets.MEXC_API_KEY }}
          MEXC_SECRET: ${{ secrets.MEXC_SECRET }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          python bot.py
