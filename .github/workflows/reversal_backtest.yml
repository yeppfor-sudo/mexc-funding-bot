name: real-funding-test
on:
  workflow_dispatch:
    inputs:
      days: {default: '30'}
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - run: pip install requests
      - name: Run REAL funding
        env:
          DAYS: ${{ inputs.days }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          cat > real_test.py << 'PYEOF'
          import requests, time, statistics as st
          BASE="https://contract.mexc.com/api/v1/contract"
          SYMS=["BMT_USDT","CAT_USDT"]
          DAYS=30
          def get(u,p=None):
            try: return requests.get(u, params=p, timeout=20, headers={"User-Agent":"Mozilla/5.0"}).json()
            except: return {}
          def fetch_funding_history(sym):
            # Try 2 endpoints that work
            j1=get(f"{BASE}/funding_rate_history", {"symbol": sym, "page_size": 200})
            lst=[]
            if isinstance(j1.get("data"), dict):
              lst=j1["data"].get("resultList",[])
            if lst:
              return lst
            # fallback single
            j2=get(f"{BASE}/funding_rate/{sym}")
            if j2.get("data"):
              return [j2["data"]]
            return []
          # Fetch real funding for 30 days
          all_events=[]
          for sym in SYMS:
            hist=fetch_funding_history(sym)
            print(f"{sym} got {len(hist)} funding records sample {hist[:1]}")
            for it in hist:
              T=int(it.get("settleTime") or it.get("time") or 0)
              if T==0: continue
              if T< (time.time()-DAYS*86400)*1000: continue
              rate=float(it.get("fundingRate") or it.get("rate") or 0)
              all_events.append((T//1000, rate, sym))
          print(f"Total real funding events: {len(all_events)}")
          # Now backtest with real rates...
          PYEOF
          python real_test.py
      - uses: actions/upload-artifact@v4
        with: {name: real-funding, path: real_test.py}
