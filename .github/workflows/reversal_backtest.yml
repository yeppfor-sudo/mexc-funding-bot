      - name: Run reversal backtest
        env:
          DAYS: ${{ inputs.days }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          cat > reversal_test.py << 'PYEOF'
          import os, csv, statistics as st, time, requests
          DAYS = int(os.getenv("DAYS", "30"))
          HOLDS = [1, 3, 5, 10, 15]
          DELAYS = [0, 1]
          STOPS = [0.01, 0.02]
          SLIPS = [0.0005, 0.0015, 0.003]
          LIQ_NOTIONAL = 3000
          SL_EXTRA = 0.003
          TOP_TRY = 5
          BASE = "https://contract.mexc.com/api/v1/contract"
          FEE_SIDE = 0.0002
          VOL_MULT = 1.0

          def get(url, params=None):
              try:
                  r = requests.get(url, params=params, timeout=20, headers={"User-Agent":"Mozilla/5.0"})
                  return r.json()
              except Exception as e:
                  print(f"GET fail {url} {e}")
                  return {}

          def tg(msg):
              token=os.getenv("TELEGRAM_BOT_TOKEN"); chat=os.getenv("TELEGRAM_CHAT_ID")
              if not token or not chat: print(msg); return
              try: requests.post(f"https://api.telegram.org/bot{token}/sendMessage", json={"chat_id":chat,"text":msg}, timeout=10)
              except: pass
              print(msg)

          def load_events_real():
              # Use direct known coins that have high funding - BMT, CAT, etc + scan
              # New MEXC endpoint for funding history
              events = []
              # Try to get funding rate history for all - use batch endpoint
              # MEXC actually uses: /funding_rate/history?symbol=xxx
              j = get(f"{BASE}/ticker")
              data = j.get("data") or []
              syms = [d.get("symbol") for d in data if str(d.get("symbol","")).endswith("_USDT")][:150]
              print(f"Got {len(syms)} symbols from ticker, sample {syms[:5]}")
              if not syms:
                  # Fallback list - known high funding coins
                  syms = ["BMT_USDT","CAT_USDT","BERA_USDT","AVAAI_USDT","AIXBT_USDT","SWARMS_USDT"]
              
              slots = {}
              failed=0
              since = int((time.time() - DAYS*86400)*1000)
              
              for sym in syms:
                  try:
                      # Correct endpoint: /funding_rate_history?symbol=...
                      jh = get(f"{BASE}/funding_rate_history", {"symbol": sym, "page_size": 200})
                      lst = []
                      if isinstance(jh.get("data"), dict):
                          lst = jh["data"].get("resultList") or jh["data"].get("result") or []
                      elif isinstance(jh.get("data"), list):
                          lst = jh["data"]
                      if not lst:
                          # Try alt endpoint
                          jh2 = get(f"{BASE}/funding_rate/{sym}")
                          d2 = jh2.get("data") or {}
                          # single current rate not history - skip
                          continue
                      for it in lst:
                          T = int(it.get("settleTime") or it.get("time") or it.get("fundingTime") or 0)
                          if T==0: continue
                          if T < since: continue
                          rate = float(it.get("fundingRate") or it.get("rate") or 0)
                          if abs(rate) < 0.0005: continue
                          Ts = T//1000 if T>1e12 else T
                          Tslot = Ts - (Ts % 14400)
                          ev = {"T": Tslot, "rate": rate, "sym": sym}
                          slots.setdefault(Tslot, []).append(ev)
                          events.append(ev)
                  except Exception as e:
                      failed+=1
              print(f"Collected {len(events)} raw funding events across {len(slots)} slots, failed {failed}")
              return slots, failed

          def kl(sym, T):
              j = get(f"{BASE}/kline/{sym}", {"interval": "Min1", "start": int(T - 300), "end": int(T + 1260)})
              d = ((j or {}).get("data")) or {}
              out = {}
              times = d.get("time") or d.get("t") or []
              opens = d.get("open") or d.get("o") or []
              highs = d.get("high") or d.get("h") or []
              lows = d.get("low") or d.get("l") or []
              closes = d.get("close") or d.get("c") or []
              vols = d.get("vol") or d.get("v") or []
              for t,o,h,l,c,v in zip(times, opens, highs, lows, closes, vols):
                  try: out[int(t)] = (float(o), float(h), float(l), float(c), float(v))
                  except: pass
              return out

          def pick_events(slots):
              chosen=[]
              for T in sorted(slots):
                  for ev in sorted(slots[T], key=lambda e: -abs(e["rate"]))[:TOP_TRY]:
                      k=kl(ev["sym"], T)
                      if not k.get(T-60) or not k.get(T): continue
                      # liquidity check: sum vol*price in 5 min before
                      turn = sum(v*c for (o,h,l,c,v) in (k[tt] for tt in k if tt < T))
                      if turn < VOL_MULT*LIQ_NOTIONAL and turn!=0: continue
                      if len(k)<5: continue
                      chosen.append((ev,k))
                      break
              return chosen

          def sim(k,T,rate,delay,hold,stop,slip):
              s=1 if rate>0 else -1
              te=T+60*delay
              c=k.get(te)
              if not c: return None
              entry=c[0]*(1+s*slip)
              last=None
              for i in range(hold):
                  cd=k.get(te+60*i)
                  if not cd: return None
                  adverse=cd[2] if s==1 else cd[1]
                  if s*(adverse-entry)/entry <= -stop:
                      return -(stop+SL_EXTRA)-2*FEE_SIDE
                  last=cd
              return s*(last[3]*(1-s*slip)-entry)/entry - 2*FEE_SIDE

          def summarize(rets):
              n=len(rets); mean=sum(rets)/n; sd=st.pstdev(rets) if n>1 else 0
              return dict(n=n, mean=mean, med=st.median(rets), win=sum(1 for r in rets if r>0)/n, t=(mean/(sd/n**0.5)) if sd>0 else 0, worst=min(rets))

          def main():
              slots, failed = load_events_real()
              chosen = pick_events(slots)
              print(f"{len(chosen)} usable (of {len(slots)} slots)")
              if len(chosen)<10:
                  tg(f"Reversal test: too few events ({len(chosen)}). API may be blocking. Slots={len(slots)}")
                  # Still create empty csv to avoid upload warning
                  open("reversal_results.csv","w").write("delay,hold,stop,slip,n,avg\n")
                  return
              rows=[]
              for delay in DELAYS:
                  for hold in HOLDS:
                      for stop in STOPS:
                          row=dict(delay=delay, hold=hold, stop=stop)
                          for slip in SLIPS:
                              rets=[]
                              for ev,k in chosen:
                                  r=sim(k, ev["T"], ev["rate"], delay, hold, stop, slip)
                                  if r is not None: rets.append((ev["T"], ev["rate"], r))
                              row[f"s{slip}"]=rets
                          rows.append(row)
              with open("reversal_results.csv","w",newline="") as f:
                  w=csv.writer(f); w.writerow(["delay_min","hold_min","stop","slip","n","avg_net_pct","median_pct","win_pct","t_stat","worst_pct"])
                  for row in rows:
                      for slip in SLIPS:
                          rets=[r for _,_,r in row[f"s{slip}"]]
                          if rets:
                              m=summarize(rets)
                              w.writerow([row["delay"],row["hold"],row["stop"],slip,m["n"],round(m["mean"]*100,3),round(m["med"]*100,3),round(m["win"]*100,1),round(m["t"],2),round(m["worst"]*100,2)])
              mid=f"s{SLIPS[1]}"; hi=f"s{SLIPS[2]}"
              ranked=sorted([r for r in rows if r[mid]], key=lambda r: -summarize([x for _,_,x in r[mid]])["mean"])
              lines=[]
              for r in ranked[:5]:
                  m=summarize([x for _,_,x in r[mid]]); m3=summarize([x for _,_,x in r[hi]])
                  ts=sorted(r[mid]); cut=len(ts)*2//3; a=[x for _,_,x in ts[:cut]]; c=[x for _,_,x in ts[cut:]]
                  first=sum(a)/len(a)*100 if a else 0; last=sum(c)/len(c)*100 if c else 0
                  lines.append(f"enter +{r['delay']}m hold {r['hold']}m stop {r['stop']*100:.0f}%: n={m['n']} avg {m['mean']*100:+.2f}% win {m['win']*100:.0f}% t={m['t']:.1f} | 0.30% slip: {m3['mean']*100:+.2f}% | first 2/3 {first:+.2f}% vs last {last:+.2f}%")
              best=ranked[0]; bm,bm3=summarize([x for _,_,x in best[mid]]), summarize([x for _,_,x in best[hi]])
              ts=sorted(best[mid]); cut=len(ts)*2//3; stable=sum(x for _,_,x in ts[:cut])>0 and sum(x for _,_,x in ts[cut:])>0
              verdict=("POSSIBLE EDGE" if (bm3["mean"]>0 and bm["t"]>=2 and stable) else "NO RELIABLE EDGE - do not trade")
              pos=[x for _,rt,x in best[mid] if rt>0]; neg=[x for _,rt,x in best[mid] if rt<0]
              tg(f"🔁 REVERSAL TEST {DAYS}d | {len(chosen)} events\nCosts: fee {FEE_SIDE*100:.2f}%/side + slip; ranked at 0.15%\n\n"+"\n".join(lines)+f"\n\nBest: +fund {sum(pos)/len(pos)*100 if pos else 0:+.2f}% n={len(pos)}, -fund {sum(neg)/len(neg)*100 if neg else 0:+.2f}% n={len(neg)}\nVERDICT: {verdict}")

          if __name__=="__main__": main()
          PYEOF
          python reversal_test.py

      - uses: actions/upload-artifact@v4
        with:
          name: reversal-results
          path: reversal_results.csv
