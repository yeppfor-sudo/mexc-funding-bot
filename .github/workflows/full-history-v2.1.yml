name: backtest-v2.1-0.5-to-inf
on:
  workflow_dispatch:
    inputs:
      days:
        default: '30'
      top_n:
        default: '60'

jobs:
  backtest:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - run: pip install requests

      - name: Backtest V2.1
        env:
          DAYS: ${{ inputs.days }}
          TOP_N: ${{ inputs.top_n }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          cat > bt.py << 'PYEOF'
          import requests, time, os, csv, statistics
          from datetime import datetime
          BASE="https://contract.mexc.com/api/v1/contract"
          HDR={"User-Agent":"Mozilla/5.0"}
          DAYS=int(os.getenv("DAYS","30"))
          TOP_N=int(os.getenv("TOP_N","60"))
          MIN_F=0.005  # +->0.5% to ∞ HARD

          def pub(p, params=None):
              try: return requests.get(f"{BASE}{p}", params=params, timeout=15, headers=HDR).json()
              except: return {}
          def get_all():
              j=pub("/detail")
              return [d["symbol"] for d in j.get("data",[]) if d.get("symbol","").endswith("_USDT")]
          def get_rates(symbols):
              rates=[]
              for s in symbols:
                  j=pub(f"/funding_rate/{s}")
                  try:
                      r=float(j["data"]["fundingRate"])
                      if abs(r) >= MIN_F:  # FILTER +->0.5% to ∞
                          rates.append((s,r,abs(r)))
                  except: pass
                  time.sleep(0.04)
              return sorted(rates, key=lambda x: x[2], reverse=True)
          def klines(sym, start, end):
              j=pub(f"/kline/{sym}", {"interval":"Min1","start":start,"end":end})
              return j.get("data",[]) if isinstance(j,dict) else []
          def tg(m):
              print(m)
              tok=os.getenv("TELEGRAM_BOT_TOKEN"); chat=os.getenv("TELEGRAM_CHAT_ID")
              if tok and chat:
                  try: requests.post(f"https://api.telegram.org/bot{tok}/sendMessage", data={"chat_id":chat,"text":m[:4000]}, timeout=10)
                  except: pass

          all_syms=get_all()
          print(f"Found {len(all_syms)} perps")
          rates=get_rates(all_syms)
          top=rates[:TOP_N]
          tg(f"🔍 V2.1 FILTER +->0.5% to ∞ Found {len(rates)} pairs >=0.5%\nTop 15:\n"+"\n".join([f"{s} {r*100:+.3f}%" for s,r,_ in top[:15]]))

          if not top:
              tg("❌ NO PAIRS >=0.5% IN 30D CURRENT - Cannot backtest (need live history, using BMT proxy)")
              # fallback to BMT only with current funding as proxy but REAL klines
              top=[("BMT_USDT",-0.00797,0.00797)]

          now=int(time.time()*1000)
          start_ms=now-DAYS*24*3600*1000
          slots=[]
          t=start_ms//(4*3600*1000)*(4*3600*1000)
          while t<now:
              slots.append(t); t+=4*3600*1000

          all_trades=[]
          summary=[]
          for sym, rate, abs_rate in top:
              side="long" if rate<0 else "short"
              trades=[]
              for T in slots:
                  ks=klines(sym, T-6*60*1000, T+7*60*1000)
                  if len(ks)<5: continue
                  entry=None; prices=[]
                  for k in ks:
                      ts=k[0]; close=float(k[4])
                      if ts>=T-60000 and ts<=T-40000: entry=close
                      if ts>=T and ts<=T+5*60*1000: prices.append(close)
                  if not entry or len(prices)<3: continue

                  # 70% entry
                  avg=entry
                  dca_price=None; dca=False
                  if side=="long":
                      low=min(prices)
                      drop=(avg-low)/avg
                      if 0.01 <= drop <= 0.015 or drop>=0.012:
                          dca_price=low; avg=(entry*0.70 + low*0.29)/0.99; dca=True
                  else:
                      high=max(prices)
                      drop=(high-avg)/avg
                      if 0.01 <= drop <= 0.015 or drop>=0.012:
                          dca_price=high; avg=(entry*0.70 + high*0.29)/0.99; dca=True

                  sl=avg*0.97 if side=="long" else avg*1.03
                  hit_sl=False; exit_price=None; reason="AVG EXIT"
                  for p in prices:
                      if side=="long" and p<=sl: hit_sl=True; exit_price=p; reason="SL -3%"; break
                      if side=="short" and p>=sl: hit_sl=True; exit_price=p; reason="SL -3%"; break
                  if not hit_sl:
                      exit_price=avg*1.0008 if side=="long" else avg*0.9992

                  price_pnl=(exit_price-avg)/avg if side=="long" else (avg-exit_price)/avg
                  fee=0.0004+0.00225
                  total_price=price_pnl - fee + abs(rate)
                  wallet_pnl=total_price*5

                  trades.append({
                      "symbol":sym,"funding_time":datetime.utcfromtimestamp(T/1000).strftime("%Y-%m-%d %H:%M"),
                      "rate_pct":rate*100,"side":side,"entry_70":entry,"dca_29":dca_price if dca else "","avg":avg,"sl":sl,"exit":exit_price,"reason":reason,
                      "dca":dca,"wallet_pct":wallet_pnl*100,"funding_pct":abs(rate)*100
                  })
              if trades:
                  pnls=[t["wallet_pct"] for t in trades]
                  avg_w=statistics.mean(pnls)
                  win=len([x for x in pnls if x>0])/len(pnls)*100
                  stops=len([t for t in trades if t["reason"]=="SL -3%"])
                  bal=10
                  for p in pnls: bal*= (1+p/100)
                  summary.append((sym, rate, len(trades), avg_w, win, stops, bal))
                  all_trades.extend(trades)
                  print(f"{sym} {rate*100:+.2f}% n={len(trades)} avg {avg_w:+.2f}% win {win:.0f}% $10->{bal:.2f}")

          os.makedirs("logs", exist_ok=True)
          with open("logs/full_trades_v2.1.csv","w", newline="") as f:
              if all_trades:
                  import csv
                  w=csv.DictWriter(f, fieldnames=all_trades[0].keys())
                  w.writeheader(); w.writerows(all_trades)
          with open("logs/pairs_summary_v2.1.csv","w", newline="") as f:
              import csv
              w=csv.writer(f)
              w.writerow(["symbol","rate","trades","avg_wallet","winrate","stops","$10_final"])
              for row in sorted(summary, key=lambda x: x[6], reverse=True):
                  w.writerow([row[0], f"{row[1]*100:.4f}%", row[2], f"{row[3]:.3f}%", f"{row[4]:.1f}%", row[5], f"${row[6]:.2f}"])

          top_summary=sorted(summary, key=lambda x: x[6], reverse=True)[:12]
          msg=f"📊 BACKTEST V2.1 +->0.5% to ∞ {DAYS}d {len(all_trades)} trades\n"
          msg+=f"Filter: >=0.5% MIN to ∞ MAX both +/-\n\nBest $10:\n"
          for sym, rate, n, avg_w, win, stops, bal in top_summary:
              msg+=f"{sym} {rate*100:+.2f}% n={n} {avg_w:+.2f}% win {win:.0f}% -> ${bal:.0f}\n"
          tg(msg)
          print(msg)
          PYEOF
          python bt.py

      - uses: actions/upload-artifact@v4
        with:
          name: backtest-v2.1-full
          path: logs/
