name: zone-4h-scan
on:
  schedule:
    - cron: "3 0,4,8,12,16,20 * * *"
  workflow_dispatch:
    inputs:
      symbol:
        description: "Test one pair, e.g. SKYAI_USDT (leave empty for normal run)"
        required: false
        default: ""
permissions:
  contents: write
concurrency:
  group: zone-scan
  cancel-in-progress: false
jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -r requirements.txt
      - name: run scanner
        run: python scanner.py
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          DEBUG_SYMBOL: ${{ github.event.inputs.symbol }}
      - name: save state
        run: |
          git config user.name "scanner-bot"
          git config user.email "bot@users.noreply.github.com"
          git add state.json
          git diff --staged --quiet || (git commit -m "update state" && git pull --rebase && git push)
