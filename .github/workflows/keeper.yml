name: keeper
on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch:
jobs:
  keep:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          gh run list --workflow funding-bot --status in_progress --json databaseId --jq '.[0].databaseId' | xargs -I {} echo "running {}"
          gh workflow run funding-bot || true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
