name: keeper
on:
  schedule:
    - cron: '*/20 * * * *'
  workflow_dispatch:
jobs:
  keep:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Keep alive
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
          GH_REPO: ${{ secrets.GH_REPO }}
        run: |
          gh workflow run funding.yml --repo $GH_REPO || true
