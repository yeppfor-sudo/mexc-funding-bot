name: keeper
on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch:
jobs:
  keeper:
    runs-on: ubuntu-latest
    steps:
      - name: Auto restart
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          RUNS=$(curl -s -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github.v3+json" "https://api.github.com/repos/$GH_REPO/actions/workflows/bot.yml/runs?per_page=5" | grep -c '"status": "in_progress"' || true)
          if [ "$RUNS" = "0" ]; then
            curl -X POST -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github.v3+json" "https://api.github.com/repos/$GH_REPO/actions/workflows/bot.yml/dispatches" -d '{"ref":"main"}'
          fi
