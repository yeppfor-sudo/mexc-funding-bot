name: keeper
on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

jobs:
  keep:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check sniper
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
        run: |
          RUNS=$(gh run list --workflow sniper --status in_progress --json databaseId -q length 2>/dev/null || echo 0)
          if [ "$RUNS" -eq 0 ]; then
            echo "No sniper running, starting one"
            gh workflow run sniper --ref main -f mode=run -f dry_run=false || true
          else
            echo "Sniper already running: $RUNS"
          fi
