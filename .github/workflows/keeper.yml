name: keeper
on:
  schedule:
        - cron: "5 */2 * * *" # check every 2 hours
  workflow_dispatch:

jobs:
  keep:
    runs-on: ubuntu-22.04
    steps:
            - uses: actions/checkout@v4

            - name: Check if sniper is running
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "Checking sniper status..."
          RUNS=$(gh run list --workflow=sniper --status=in_progress --limit 1 --json databaseId | jq length)
          echo "In progress sniper runs: $RUNS"
          if [ "$RUNS" -eq 0 ]; then
            echo "Sniper not running -> starting REAL money sniper..."
            gh workflow run sniper --ref main -f mode=run_once -f dry_run=false
          else
            echo "Sniper already running - OK"
          fi
