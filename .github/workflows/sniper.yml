name: sniper
on:
  workflow_dispatch:
    inputs:
      mode:
        description: "scan or run_once or test_now"
        default: "test_now"
jobs:
  trade:
    runs-on: ubuntu-latest
    timeout-minutes: 370
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install requests PySocks
      - name: Run
        env:
          MEXC_API_KEY: ${{ secrets.MEXC_API_KEY }}
          MEXC_API_SECRET: ${{ secrets.MEXC_API_SECRET }}
          PROXY_URL: ${{ secrets.PROXY_URL }}
          LEVERAGE: "5"
        run: python bot.py ${{ inputs.mode || 'test_now' }}
