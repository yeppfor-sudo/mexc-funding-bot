name: sniper
on:
  workflow_dispatch:
    inputs:
      mode:
        description: "run or run_once or scan"
        default: "run_once"
      dry_run:
        description: "true/false - false=REAL MONEY"
        default: "false"
  schedule:
    - cron: "58 3,7,11,15,19,23 * * *"

jobs:
  trade:
    runs-on: ubuntu-22.04
    timeout-minutes: 370
    steps:
      - uses: actions/checkout@v4

      - name: Fix GitHub IP banned by MEXC WAF
        uses: fscarmen/warp-on-actions@v1.3
        with:
          stack: dual
          mode: client

      - name: Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install
        run: pip install -r requirements.txt

      - name: Run
        env:
          MEXC_API_KEY: ${{ secrets.MEXC_API_KEY }}
          MEXC_API_SECRET: ${{ secrets.MEXC_API_SECRET }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          DRY_RUN: ${{ inputs.dry_run || 'false' }}
          LEVERAGE: "5"
          MIN_RATE_PCT: "0.5"
          ENTRY_PCT: "70"
          DCA_PCT: "29"
          RUN_SECONDS: "20700"
        run: python bot.py ${{ inputs.mode || 'run_once' }}
