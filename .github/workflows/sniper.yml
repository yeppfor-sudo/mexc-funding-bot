name: sniper
on:
  workflow_dispatch:
    inputs:
      mode:
        description: "scan or run_once or test_now"
        default: "test_now"

jobs:
  trade:
    runs-on: ubuntu-22.04
    timeout-minutes: 370
    steps:
      - uses: actions/checkout@v4
      - name: WARP + Proxy
        uses: fscarmen/warp-on-actions@v1.3
        with:
          stack: dual
          mode: client
          allow-bypass: true
          check-ip: true
      - name: Check IP
        run: |
          sleep 10
          curl -s https://api.ipify.org; echo " WARP IP"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install requests
      - name: Run
        env:
          MEXC_API_KEY: ${{ secrets.MEXC_API_KEY }}
          MEXC_API_SECRET: ${{ secrets.MEXC_API_SECRET }}
          PROXY_URL: ${{ secrets.PROXY_URL }}
          LEVERAGE: "5"
        run: python bot.py ${{ inputs.mode || 'test_now' }}
